<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(var(--dot) 1.5px,transparent 1.8px) 0 0/14px 14px,var(--bg);color:var(--tx);font:800 16px/1.4 Nunito,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
header{text-align:center;padding:18px 0 8px}
h1{font:400 clamp(46px,14vw,104px)/.95 Bangers,Impact,sans-serif;margin:0;color:var(--pop);-webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:5px 5px 0 #111;transform:rotate(-2deg);letter-spacing:.02em}

h2{font:400 clamp(28px,7vw,42px)/1 Bangers,Impact,sans-serif;letter-spacing:.03em;margin:14px 0 14px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:20px}
.mode,.card{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;color:#111;border:4px solid #111;box-shadow:7px 7px 0 #111;transition:transform .12s,box-shadow .12s}
.mode{padding:18px}
.mode:hover,.card:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 #111}
.mode:focus-visible,.card:focus-visible{outline:4px solid var(--hot);outline-offset:3px}
.mode b{display:block;font:400 42px/1 Bangers,Impact,sans-serif;letter-spacing:.03em;margin-bottom:6px}
.mode:nth-child(1) b{color:#1f9d55}.mode:nth-child(2) b{color:var(--hot)}.mode:nth-child(3) b{color:#8e24aa}.mode:nth-child(4) b{color:#2a6fdb}input{font:800 22px Nunito,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;width:5.5em;min-height:46px;border:4px solid #111;padding:0 10px;background:#fff;color:#111}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:18px}
.card{display:flex;flex-direction:column;position:relative}
.card .art{border-bottom:4px solid #111}
.card svg{display:block;width:100%;height:auto}
svg text{font:400 30px Bangers,Impact,sans-serif;fill:#fff;stroke:#111;stroke-width:5px;paint-order:stroke fill;letter-spacing:.03em}
.t{padding:10px}
.card h3{font:400 28px/1 Bangers,Impact,sans-serif;letter-spacing:.03em;margin:0 0 4px}
.card p{margin:0 0 8px;font-size:13px;line-height:1.35}
.card::before{content:attr(data-pick);position:absolute;top:8px;right:8px;background:var(--hot);color:#fff;font:400 22px Bangers,Impact,sans-serif;padding:2px 10px;border:3px solid #111;z-index:1;transform:rotate(4deg)}
.card[data-pick=""]::before{display:none}
.st{display:grid;grid-template-columns:58px 1fr;gap:6px;align-items:center;font-size:12px;margin-top:3px}
.st i{height:9px;border:2px solid #111;background:#e6e6e6;position:relative}
.st i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--c)}
.link{background:none;border:0;color:var(--tx);font:800 15px Nunito,system-ui,sans-serif;text-decoration:underline;cursor:pointer;padding:6px 0}
canvas{width:100%;display:block;border:4px solid #111;box-shadow:7px 7px 0 #111;background:#0c1a1f;touch-action:none}
.pad{touch-action:none;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-top:14px;user-select:none;-webkit-user-select:none}
.pad::before{content:attr(data-l);flex-basis:100%;font:400 22px Bangers,Impact,sans-serif;letter-spacing:.03em}
.pad div{display:flex;gap:8px}
.pad button{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;min-width:54px;min-height:56px;padding:0 12px;border:3px solid #111;background:#fff;color:#111;font:800 15px Nunito,system-ui,sans-serif;touch-action:none;box-shadow:3px 3px 0 #111}
.pad button.on{background:var(--hot);color:#fff}
#fin{margin:0 0 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

#pm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.6)}
[hidden]{display:none!important}
</style>

<meta name="description" content="Vigilantes: jogo de luta com 26 heróis, modo história, horda e online.">
</head>
<body>
<main>
<header><h1>Vigilantes</h1><p>26 heróis, 4 modos e 12 cenários. Escolha como você quer lutar.</p></header>
<section id="modes"><div class="modes">
<button class="mode" data-mode="story"><b>História</b>Escolha um herói e enfrente 4 vilões com poderes únicos. No chefão final (sorteado: Ômega, Titã Rubro ou Rainha Nyx) você ganha 2 aliados.</button>
<button class="mode" data-mode="bot"><b>Contra o Bot</b>Você contra o computador. O bot desvia, usa especiais e fica mais agressivo a cada round.</button>
<button class="mode" data-mode="net"><b>Online</b>Dois aparelhos diferentes. Crie uma sala, passe o código ao amigo e lutem pela internet.</button>
<button class="mode" data-mode="horde"><b>Horda</b>Você e 2 aliados contra ondas de zumbis e um chefão no fim de cada fase. Online, os aliados podem ser seus amigos.</button>
</div></section>
<section id="roster" hidden><button class="link" id="back">← Trocar modo</button><h2 id="who"></h2><button class="btn" id="goco" hidden style="margin:0 0 12px">Começar</button><div class="chips" id="difrow"></div><div class="chips" id="cats"></div><div class="roster" id="grid"></div></section>
<section id="online" hidden><button class="link" id="back2">← Trocar modo</button><h2>Jogo online</h2><p id="onmsg"></p><div class="chips" id="nmrow"><span class="lbl">Tipo de partida:</span><button class="chip on" id="nm1">1 contra 1</button><button class="chip" id="nm2">Cooperativo: horda (até 3)</button></div><div id="onbox" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center"><button class="btn" id="mk">Criar sala</button><span>ou</span><input id="cd" maxlength="4" placeholder="CÓDIGO" aria-label="Código da sala"><button class="btn" id="jn">Entrar</button><span>ou</span><button class="btn" id="qm">Partida rápida</button></div></section>
<section id="game" hidden>
<div id="fin" hidden><b id="res"></b><button class="btn" id="rematch">Revanche</button><button class="btn" id="menu">Menu</button></div>
<button class="btn" id="pz" style="min-height:38px;font-size:19px;margin:0 0 10px">⏸ Pausar</button>
<div id="cvw" style="position:relative"><canvas id="cv" width="1000" height="400" aria-label="Arena de luta"></canvas><div id="pm" hidden><button class="btn" id="pmc">Continuar</button><button class="btn" id="pmq" style="background:#fff">Desistir da partida</button></div></div>
<div id="pads"></div>
<p id="help"></p>
</section>
</main>

<script>
if(!window.claude&&window.Peer){window.claude={use:async n=>n=='room'?{join:name=>new Promise((res,rej)=>{
const isH=window.NETROLE!='g',id='vigilantes-'+name,me={peer:'me',isMe:true,presence:{}},oth=new Map(),cons=new Map();let hs=[],pr=null,done=false,tries=0;
const list=()=>[me,...[...oth].map(([k,v])=>({peer:k,isMe:false,presence:v}))];
const fire=(x={})=>hs.forEach(h=>h(Object.assign({peers:list(),joined:[],left:[],updated:[]},x)));
const snd=(c,m)=>{try{if(c&&c.open)c.send(m)}catch(e){}};
const room={presence:async patch=>{me.presence=Object.assign({},me.presence,patch);cons.forEach(c=>snd(c,{t:'p',from:isH?'H':'me',p:patch}))},peers:()=>list(),onPeers:h=>{hs.push(h);return()=>{hs=hs.filter(x=>x!==h)}},leave:async()=>{try{cons.forEach(c=>c.close());pr&&pr.destroy()}catch(e){}}};
const fin=()=>{if(!done){done=true;res(room)}},bad=m=>{if(!done){done=true;rej(new Error(m))}};
if(isH){pr=new Peer(id);
pr.on('open',()=>{pr.on('connection',c=>{const g=c.peer;cons.set(g,c);
c.on('open',()=>{snd(c,{t:'p',from:'H',p:me.presence});oth.forEach((p,k)=>{if(k!=g)snd(c,{t:'p',from:k,p})})});
c.on('data',m=>{if(m&&m.t=='p'){oth.set(g,Object.assign({},oth.get(g),m.p));cons.forEach((d,k)=>{if(k!=g)snd(d,{t:'p',from:g,p:m.p})});fire()}});
c.on('close',()=>{const p=oth.get(g)||{};oth.delete(g);cons.delete(g);cons.forEach(d=>snd(d,{t:'x',from:g}));fire({left:[{peer:g,isMe:false,presence:p}]})})});fin()});
pr.on('error',e=>bad(e.type=='unavailable-id'?'Esse código já está em uso. Crie outra sala.':'Erro de conexão com o serviço online ('+e.type+').'))}
else{const go=()=>{pr=new Peer();
pr.on('error',e=>{if(e.type=='peer-unavailable'&&++tries<8){try{pr.destroy()}catch(x){}setTimeout(go,1500)}else bad(e.type=='peer-unavailable'?'Sala não encontrada. Confira o código e peça para o amigo criar a sala primeiro.':'Erro de conexão com o serviço online ('+e.type+').')});
pr.on('open',()=>{const c=pr.connect(id,{reliable:true});cons.set('H',c);
c.on('open',()=>{snd(c,{t:'p',from:'me',p:me.presence});fin()});
c.on('data',m=>{if(m&&m.t=='p'){oth.set(m.from,Object.assign({},oth.get(m.from),m.p));fire()}else if(m&&m.t=='x'){const p=oth.get(m.from)||{};oth.delete(m.from);fire({left:[{peer:m.from,isMe:false,presence:p}]})}});
c.on('close',()=>{const l=[...oth].map(([k,v])=>({peer:k,isMe:false,presence:v}));oth.clear();fire({left:l})})})};
go();setTimeout(()=>bad('Não consegui conectar à sala (tempo esgotado). Tente de novo.'),20000)}})}:null}}

net.b=[{},{},{}];net.mine=[];for(let t=0;t<NPD;t++){for(let k=0;k<3;k++)net.b[k][t]=0;net.mine[t]=0}net.n=0;net.s=NPD;net.go=1;net.wait=0;

paused=false;$('#pz').hidden=false;$('#pz').textContent='⏸ Menu';$('#pm').hidden=true;$('#goco').hidden=true;$('#fin').hidden=true;show('game');if(net.co)horde();else round();netLogic(net.r.peers())}
function netPump(){let ch=0;while(net.s<=net.n+NPD){const a=inp(0),b=inp(1);net.mine[net.s]=net.b[net.idx][net.s]=(a.l||b.l?1:0)|(a.r||b.r?2:0)|(a.u||b.u?4:0)|(a.p||b.p?8:0)|(a.s||b.s?16:0)|(a.b||b.b?32:0);net.s++;ch=1}
if(ch){for(let k=0;k<3;k++)delete net.b[k][net.n-300];netSend()}}
function netSend(){const f=Math.max(0,net.s-90);let t='';for(let k=f;k<net.s;k++)t+=String.fromCharCode(48+net.mine[k]);net.r.presence({e:net.e,f,i:t,pi:net.idx}).catch(()=>{})}
const netReady=()=>net.hu.every((h,k)=>!h||net.b[k][net.n]!==undefined);
const nin=i=>{const m=net.b[i][net.n]||0;return{l:m&1,r:m&2,u:m&4,p:m&8,s:m&16,b:m&32}};

{const l=document.createElement('span');l.textContent='Dificuldade:';l.className='lbl';$('#difrow').append(l);DN.forEach((n,i)=>{const b=document.createElement('button');b.className='chip';b.textContent=n;b.onclick=()=>{dif=i;chips()};$('#difrow').append(b)});

const pauseT=()=>{if(st=='sel'||st=='over')return;if(net){$('#pm').hidden=!$('#pm').hidden;return}if(st!='fight')return;paused=!paused;$('#pz').textContent=paused?'▶ Continuar':'⏸ Pausar';$('#pm').hidden=!paused;if(paused)rel()};

let qRoom=null,qOff=null,qOn=0,qT=0;
function qPair(room){const l=room.peers().filter(p=>p.presence&&p.presence.mq).sort((a,b)=>a.presence.mq-b.presence.mq||(a.peer<b.peer?-1:1));const i=l.findIndex(p=>p.isMe);if(i<0)return null;const o=l[i%2?i-1:i+1];if(!o)return null;const host=i%2==0,sn=x=>x.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,16);return{host,name:'q'+sn((host?l[i]:o).peer)+sn((host?o:l[i]).peer)}}
function qCheck(){if(!qOn||net)return;const p=qPair(qRoom);if(!p)return;clearTimeout(qT);qT=setTimeout(()=>{const p2=qPair(qRoom);if(!qOn||net||!p2||p2.name!=p.name)return;qOn=0;try{qOff&&qOff()}catch(e){}qRoom.presence({mq:null}).catch(()=>{});enter(p2.host?'h':'g',p2.name,1)},600)}

let qp=null;
function qmStop(){qOn=0;try{qp&&qp.destroy()}catch(e){}qp=null}
function qmStart(){if(!qOn)return;const p=new Peer('vigilantes-lobby');qp=p;let queue=[{me:1}];
const pair=()=>{while(queue.length>=2){const a=queue.shift(),b=queue.shift(),name=Math.random().toString(36).slice(2,8);
const go=(x,role)=>{if(x.me){qOn=0;qp=null;setTimeout(()=>{try{p.destroy()}catch(e){}},900);enter(role,name,1)}else{try{x.c.send({t:'m',name,role})}catch(e){}}};go(b,'g');go(a,'h')}};
p.on('open',()=>{p.on('connection',c=>{c.on('data',m=>{if(m&&m.t=='q'){queue.push({c});pair()}});c.on('close',()=>{queue=queue.filter(x=>x.c!==c)})})});
p.on('error',e=>{if(!qOn)return;try{p.destroy()}catch(x){}if(e.type=='unavailable-id')qmJoin();else setTimeout(qmStart,2500)})}
function qmJoin(){if(!qOn)return;const p=new Peer();qp=p;
p.on('open',()=>{const c=p.connect('vigilantes-lobby',{reliable:true});
c.on('open',()=>c.send({t:'q'}));
c.on('data',m=>{if(m&&m.t=='m'){qOn=0;try{p.destroy()}catch(e){}qp=null;enter(m.role,m.name,1)}});
c.on('close',()=>{if(qOn){try{p.destroy()}catch(e){}setTimeout(qmStart,600+Math.random()*1500)}})});
p.on('error',e=>{if(!qOn)return;try{p.destroy()}catch(x){}setTimeout(e.type=='peer-unavailable'?qmStart:qmJoin,1500)})}
