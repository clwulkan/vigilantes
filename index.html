<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Vigilantes e A Coroa do Fim</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%A5%8A%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* Tela de escolha: uma página de HQ dividida em dois quadros na diagonal. */
:root {
  --tinta: #000;
  --papel: #fff;
  --azul: #1e6bff;
  --amarelo: #ffd23f;
  --carmim: #c1121f;
  --roxo: #3b1c5a;
  --ouro: #f5b700;
  --sarjeta: 14px;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; background: var(--tinta); touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Nunito', system-ui, sans-serif; color: var(--tinta); overflow: hidden; }

.pagina { position: fixed; inset: 0; background: var(--papel); }

/* Quadros: cada um é um link inteiro, recortado na diagonal, com sarjeta branca entre eles. */
.quadro {
  position: absolute; inset: 0; display: block; text-decoration: none; color: inherit; overflow: hidden;
  outline: none;
}
.quadro::before { /* retícula de HQ */
  content: ''; position: absolute; inset: -10%; opacity: .22; pointer-events: none;
  background-image: radial-gradient(var(--tinta) 1.6px, transparent 1.9px); background-size: 11px 11px;
}
.quadro::after { /* raios de ação saindo do personagem */
  content: ''; position: absolute; inset: -40%; pointer-events: none; opacity: .16;
  background: repeating-conic-gradient(from 0deg at var(--fx) var(--fy), var(--papel) 0 4deg, transparent 4deg 14deg);
}
.vig {
  --fx: 30%; --fy: 52%;
  background: radial-gradient(circle at 30% 50%, #4f8dff 0, var(--azul) 45%, #0a3ea8 100%);
  clip-path: polygon(0 0, calc(58% - var(--sarjeta) / 2) 0, calc(42% - var(--sarjeta) / 2) 100%, 0 100%);
}
.cor {
  --fx: 72%; --fy: 50%;
  background: radial-gradient(circle at 72% 46%, #e2303c 0, var(--carmim) 40%, var(--roxo) 100%);
  clip-path: polygon(calc(58% + var(--sarjeta) / 2) 0, 100% 0, 100% 100%, calc(42% + var(--sarjeta) / 2) 100%);
}

/* Conteúdo de cada quadro */
.conteudo { position: absolute; top: 60%; transform: translateY(-50%); width: 36%; display: grid; gap: 18px; z-index: 2; }
.vig .conteudo { left: 5%; }
.cor .conteudo { right: 6%; justify-items: end; text-align: right; }

.titulo {
  font-family: 'Bangers', Impact, sans-serif; font-weight: 400; line-height: .86; letter-spacing: .02em;
  font-size: clamp(54px, 9.4vw, 132px); color: var(--amarelo);
  -webkit-text-stroke: 3px var(--tinta); paint-order: stroke fill;
  text-shadow: 6px 6px 0 var(--tinta);
  transform: rotate(-4deg); transform-origin: left center;
}
.cor .titulo { color: var(--ouro); transform: rotate(-3deg); transform-origin: right center; padding-right: 8px; }
.cor .titulo small { display: block; font-size: .5em; color: var(--papel); }

.balao {
  position: relative; background: var(--papel); border: 3px solid var(--tinta); border-radius: 22px;
  padding: 12px 16px; font-size: clamp(14px, 1.65vw, 19px); line-height: 1.35; max-width: 34ch;
  box-shadow: 5px 5px 0 var(--tinta);
}
.balao::after { /* rabinho do balão */
  content: ''; position: absolute; bottom: -18px; left: 34px; width: 22px; height: 20px; background: var(--papel);
  border-right: 3px solid var(--tinta); border-bottom: 3px solid var(--tinta); transform: skewX(35deg);
  clip-path: polygon(0 0, 100% 0, 100% 100%);
}
.cor .balao::after { left: auto; right: 34px; transform: skewX(-35deg) scaleX(-1); }

.botao {
  display: inline-block; justify-self: start; font-family: 'Bangers', Impact, sans-serif; letter-spacing: .05em;
  font-size: clamp(24px, 3vw, 36px); padding: 8px 26px 6px; background: var(--amarelo); color: var(--tinta);
  border: 4px solid var(--tinta); box-shadow: 6px 6px 0 var(--tinta); transform: rotate(-2deg);
  transition: transform .12s, box-shadow .12s;
}
.cor .botao { justify-self: end; background: var(--ouro); transform: rotate(2deg); }

/* Arte de cada quadro */
.arte { position: absolute; z-index: 1; pointer-events: none; }
.vig .arte { left: 6%; top: 6%; width: clamp(90px, 15vw, 190px); transform: rotate(-8deg); }
.cor .arte { right: 7%; top: 9%; width: clamp(100px, 17vw, 220px); transform: rotate(6deg); }
.arte svg { width: 100%; height: auto; display: block; overflow: visible; }

.onoma { /* onomatopeia */
  position: absolute; z-index: 1; font-family: 'Bangers', Impact, sans-serif; color: var(--papel);
  -webkit-text-stroke: 2px var(--tinta); paint-order: stroke fill; text-shadow: 4px 4px 0 var(--tinta);
  font-size: clamp(30px, 4.4vw, 64px); pointer-events: none;
}
.vig .onoma { left: 7%; bottom: 8%; transform: rotate(-10deg); }
.cor .onoma { right: 8%; bottom: 7%; transform: rotate(8deg); color: var(--amarelo); }

/* Legenda do narrador no topo, no meio da sarjeta */
.narrador {
  position: absolute; z-index: 5; left: 50%; top: 18px; transform: translateX(-50%) rotate(-1.5deg);
  background: var(--amarelo); border: 3px solid var(--tinta); box-shadow: 5px 5px 0 var(--tinta);
  font-family: 'Bangers', Impact, sans-serif; letter-spacing: .04em; font-size: clamp(20px, 2.6vw, 32px);
  padding: 6px 18px 4px; white-space: nowrap; pointer-events: none;
}

/* Toque e foco: o quadro escolhido "salta" da página */
.quadro:hover .botao, .quadro:focus-visible .botao { transform: rotate(-2deg) scale(1.08); box-shadow: 9px 9px 0 var(--tinta); }
.cor:hover .botao, .cor:focus-visible .botao { transform: rotate(2deg) scale(1.08); }
.quadro:active .botao { transform: scale(.96); box-shadow: 2px 2px 0 var(--tinta); }
.quadro:focus-visible .botao { outline: 4px dashed var(--papel); outline-offset: 6px; }

/* Entrada: os dois quadros batem na página uma vez, como um "BLAM" */
@media (prefers-reduced-motion: no-preference) {
  .vig { animation: entraEsq .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .cor { animation: entraDir .5s .08s cubic-bezier(.2, 1.4, .4, 1) both; }
  .narrador { animation: carimbo .35s .45s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes entraEsq { from { transform: translateX(-60%); } }
  @keyframes entraDir { from { transform: translateX(60%); } }
  @keyframes carimbo { from { transform: translateX(-50%) rotate(-1.5deg) scale(2.2); opacity: 0; } }
}

/* Em pé (celular): quadros um em cima do outro, diagonal deitada */
@media (orientation: portrait) {
  .vig { clip-path: polygon(0 0, 100% 0, 100% calc(44% - var(--sarjeta) / 2), 0 calc(56% - var(--sarjeta) / 2)); --fx: 30%; --fy: 26%; }
  .cor { clip-path: polygon(0 calc(56% + var(--sarjeta) / 2), 100% calc(44% + var(--sarjeta) / 2), 100% 100%, 0 100%); --fx: 70%; --fy: 76%; }
  .conteudo { width: auto; left: 6% !important; right: 6% !important; transform: none; gap: 12px; }
  .vig .conteudo { top: 15%; }
  .cor .conteudo { top: auto; bottom: 6%; }
  .titulo { font-size: clamp(46px, 13vw, 90px); }
  .vig .arte { left: auto; right: 6%; top: 8%; width: 26%; }
  .cor .arte { right: auto; left: 6%; top: 58%; width: 28%; }
  .vig .onoma { bottom: auto; top: 40%; left: auto; right: 8%; }
  .cor .onoma { top: auto; bottom: 7%; right: auto; left: 7%; }
  .narrador { top: 10px; }
  .balao { max-width: 30ch; }
}
</style>
</head>
<body>
<main class="pagina">
  <a class="quadro vig" href="luta/" aria-label="Jogar Vigilantes">
    <span class="arte" aria-hidden="true">
      <!-- máscara de herói com um raio -->
      <svg viewBox="0 0 200 200">
        <polygon points="100,4 122,72 196,60 136,104 170,170 100,130 30,170 64,104 4,60 78,72" fill="#fff" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
        <path d="M30 92 Q100 50 170 92 Q160 128 124 124 Q108 110 100 112 Q92 110 76 124 Q40 128 30 92 Z" fill="#000"/>
        <ellipse cx="68" cy="99" rx="17" ry="11" fill="#fff"/><ellipse cx="132" cy="99" rx="17" ry="11" fill="#fff"/>
        <polygon points="112,128 92,160 106,160 96,190 126,150 110,150 122,128" fill="#ffd23f" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
      </svg>
    </span>
    <span class="onoma" aria-hidden="true">POW!</span>
    <span class="conteudo">
      <span class="titulo">Vigilantes</span>
      <span class="balao">Luta de heróis, um contra um. Jogue contra o bot, com um amigo do lado ou pela internet.</span>
      <span class="botao">Jogar Vigilantes</span>
    </span>
  </a>

  <a class="quadro cor" href="coroa/" aria-label="Jogar A Coroa do Fim">
    <span class="arte" aria-hidden="true">
      <!-- a Coroa -->
      <svg viewBox="0 0 220 180">
        <path d="M14 150 L4 40 L58 92 L110 10 L162 92 L216 40 L206 150 Z" fill="#f5b700" stroke="#000" stroke-width="7" stroke-linejoin="round"/>
        <rect x="10" y="140" width="200" height="30" rx="4" fill="#ffd23f" stroke="#000" stroke-width="7"/>
        <circle cx="110" cy="112" r="17" fill="#e2303c" stroke="#000" stroke-width="5"/>
        <circle cx="52" cy="122" r="11" fill="#1e6bff" stroke="#000" stroke-width="5"/>
        <circle cx="168" cy="122" r="11" fill="#1e6bff" stroke="#000" stroke-width="5"/>
        <circle cx="4" cy="38" r="9" fill="#fff" stroke="#000" stroke-width="5"/><circle cx="110" cy="9" r="9" fill="#fff" stroke="#000" stroke-width="5"/><circle cx="216" cy="38" r="9" fill="#fff" stroke="#000" stroke-width="5"/>
        <path d="M86 70 L96 58 M126 60 L136 72" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="onoma" aria-hidden="true">CRASH!</span>
    <span class="conteudo">
      <span class="titulo"><small>A Coroa</small>do Fim</span>
      <span class="balao">Você e seus aliados contra o exército do Ômega. Proteja a Coroa até o fim.</span>
      <span class="botao">Jogar A Coroa do Fim</span>
    </span>
  </a>

  <div class="narrador">Qual aventura vai ser hoje?</div>
</main>
<script>
// Trava de zoom (mesma ideia dos jogos): dois toques rápidos e pinça não dão zoom no iPad.
(function () {
  let ultimo = -1e9;
  document.addEventListener('touchend', e => { if (e.timeStamp - ultimo < 350 && e.cancelable) e.preventDefault(); ultimo = e.timeStamp; }, { passive: false });
  ['gesturestart', 'gesturechange'].forEach(n => document.addEventListener(n, e => e.preventDefault()));
})();
</script>
</body>
</html>
